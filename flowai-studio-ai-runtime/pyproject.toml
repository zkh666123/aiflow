[project]
name = "flowai-studio-ai-runtime"
version = "0.1.0"
description = "FlowAI Studio AI execution plane"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "psycopg[binary]==3.3.4",
  "sqlalchemy==2.0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiflow_runtime"]
