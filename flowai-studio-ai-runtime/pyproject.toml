[project]
name = "flowai-studio-ai-runtime"
version = "0.1.0"
description = "FlowAI Studio AI execution plane"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.139.0",
  "flowai-proto",
  "grpcio==1.74.0",
  "httpx==0.28.1",
  "langgraph==1.2.9",
  "mcp==1.28.1",
  "orjson==3.11.9",
  "protobuf==6.31.1",
  "psycopg[binary]==3.3.4",
  "pwdlib[argon2]==0.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pyjwt==2.13.0",
  "pypdf==6.14.2",
  "pyyaml==6.0.3",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "rank-bm25==0.2.2",
  "redis==8.0.1",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiflow_runtime"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv.sources]
flowai-proto = { path = "../proto/python", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
