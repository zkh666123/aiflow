name: CI

on:
  workflow_dispatch: {}

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.13'

jobs:
  python:
    name: Python backend and sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: python -m pip install uv==0.11.26
      - name: Install backend dependencies
        run: uv sync --frozen --project flowai-studio-backend
      - name: Install sandbox dependencies
        run: uv sync --frozen --project flowai-studio-sandbox
      - name: Test backend
        working-directory: flowai-studio-backend
        env:
          FLOWAI_JWT_SECRET: ci-jwt-secret-00000000000000000000000000000000
          FLOWAI_API_KEY_HMAC_SECRET: ci-hmac-secret-0000000000000000000000000000000
          FLOWAI_DATABASE_URL: postgresql+psycopg://flowai:flowai@127.0.0.1:5432/flowai_test
          FLOWAI_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run --frozen pytest
      - name: Test sandbox
        working-directory: flowai-studio-sandbox
        run: uv run --frozen pytest

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: flowai-studio-frontend/package-lock.json
      - name: Install dependencies
        working-directory: flowai-studio-frontend
        run: npm ci
      - name: Build
        working-directory: flowai-studio-frontend
        run: npm run build
