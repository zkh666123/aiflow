[project]
name = "flowai-studio-sandbox"
version = "0.1.0"
description = "Fail-closed FlowAI Studio CPython WASI sandbox manager"
requires-python = ">=3.13,<3.14"
dependencies = [
  "flowai-proto",
  "grpcio==1.74.0",
  "protobuf==6.31.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "wasmtime==46.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiflow_sandbox"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv.sources]
flowai-proto = { path = "../proto/python", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
