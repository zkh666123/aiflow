syntax = "proto3";

package aiflow.v1;

import "aiflow/v1/common.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/gulugulu33/aiflow-studio/flowai-studio-control-plane/internal/gen/aiflow/v1;aiflowv1";

service RetrievalService {
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
}

enum RetrievalMode {
  RETRIEVAL_MODE_UNSPECIFIED = 0;
  RETRIEVAL_MODE_VECTOR = 1;
  RETRIEVAL_MODE_KEYWORD = 2;
  RETRIEVAL_MODE_HYBRID = 3;
}

enum RerankerProvider {
  RERANKER_PROVIDER_UNSPECIFIED = 0;
  RERANKER_PROVIDER_NONE = 1;
  RERANKER_PROVIDER_COHERE = 2;
  RERANKER_PROVIDER_OLLAMA = 3;
}

message RerankerOptions {
  RerankerProvider provider = 1;
  string model = 2;
  int32 top_n = 3;
  bool allow_fallback = 4;
}

message RetrieveRequest {
  RequestContext context = 1;
  string knowledge_base_id = 2;
  string query = 3;
  RetrievalMode mode = 4;
  int32 top_k = 5;
  double vector_weight = 6;
  double keyword_weight = 7;
  RerankerOptions reranker = 8;
  google.protobuf.Struct filters = 9;
}

message RetrievalHit {
  string chunk_id = 1;
  string document_id = 2;
  string content = 3;
  google.protobuf.Struct metadata = 4;
  double vector_score = 5;
  double keyword_score = 6;
  double fused_score = 7;
  double reranker_score = 8;
}

message RetrieveResponse {
  repeated RetrievalHit hits = 1;
  bool reranker_applied = 2;
  bool reranker_fallback = 3;
  ServiceError reranker_error = 4;
}
