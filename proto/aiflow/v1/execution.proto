syntax = "proto3";

package aiflow.v1;

import "aiflow/v1/common.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/gulugulu33/aiflow-studio/flowai-studio-control-plane/internal/gen/aiflow/v1;aiflowv1";

service ExecutionService {
  rpc ExecuteNode(ExecuteNodeRequest) returns (stream ExecuteNodeResponse);
}

message LlmNodeSpec {
  string provider = 1;
  string model = 2;
  string system_prompt = 3;
  string prompt = 4;
  double temperature = 5;
  int32 max_tokens = 6;
  repeated string stop_sequences = 7;
}

message RagNodeSpec {
  string knowledge_base_id = 1;
  string query = 2;
  int32 top_k = 3;
  bool enable_reranker = 4;
}

message AgentNodeSpec {
  string mode = 1;
  string provider = 2;
  string model = 3;
  string instructions = 4;
  repeated string tool_ids = 5;
  int32 max_iterations = 6;
  google.protobuf.Struct configuration = 7;
}

message SkillNodeSpec {
  string skill_id = 1;
  google.protobuf.Struct arguments = 2;
}

message ExecuteNodeRequest {
  RequestContext context = 1;
  string execution_id = 2;
  string node_id = 3;
  google.protobuf.Struct inputs = 4;

  oneof spec {
    LlmNodeSpec llm = 5;
    RagNodeSpec rag = 6;
    AgentNodeSpec agent = 7;
    SkillNodeSpec skill = 8;
  }
}

enum TraceType {
  TRACE_TYPE_UNSPECIFIED = 0;
  TRACE_TYPE_THINKING = 1;
  TRACE_TYPE_TOOL_CALL = 2;
  TRACE_TYPE_TOOL_RESULT = 3;
  TRACE_TYPE_RETRIEVAL = 4;
  TRACE_TYPE_DELEGATION = 5;
  TRACE_TYPE_WORKER_RESULT = 6;
  TRACE_TYPE_FINAL_ANSWER = 7;
  TRACE_TYPE_ERROR = 8;
}

message NodeStarted {
  string provider = 1;
  string model = 2;
}

message TokenDelta {
  string text = 1;
}

message AgentTrace {
  TraceType type = 1;
  string message = 2;
  google.protobuf.Struct data = 3;
}

message NodeOutput {
  google.protobuf.Struct value = 1;
}

message UsageReported {
  TokenUsage usage = 1;
}

message NodeFailed {
  ServiceError error = 1;
}

message NodeCompleted {
  bool success = 1;
}

message ExecuteNodeResponse {
  string execution_id = 1;
  string node_id = 2;
  int64 sequence = 3;
  google.protobuf.Timestamp emitted_at = 4;

  oneof payload {
    NodeStarted started = 5;
    TokenDelta token = 6;
    AgentTrace trace = 7;
    NodeOutput output = 8;
    UsageReported usage = 9;
    NodeFailed error = 10;
    NodeCompleted done = 11;
  }
}
