syntax = "proto3";

package aiflow.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/gulugulu33/aiflow-studio/flowai-studio-control-plane/internal/gen/aiflow/v1;aiflowv1";

message RequestContext {
  string request_id = 1;
  string trace_id = 2;
  string caller = 3;
  string idempotency_key = 4;
  google.protobuf.Timestamp deadline = 5;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_FORBIDDEN = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_RATE_LIMITED = 6;
  ERROR_CODE_TIMEOUT = 7;
  ERROR_CODE_CANCELLED = 8;
  ERROR_CODE_PROVIDER_UNAVAILABLE = 9;
  ERROR_CODE_RESOURCE_EXHAUSTED = 10;
  ERROR_CODE_INTERNAL = 11;
}

message ServiceError {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  map<string, string> metadata = 4;
}

message TokenUsage {
  int64 prompt_tokens = 1;
  int64 completion_tokens = 2;
  int64 total_tokens = 3;
  string provider = 4;
  string model = 5;
  string estimated_cost = 6;
}

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_HEALTHY = 1;
  HEALTH_STATE_DEGRADED = 2;
  HEALTH_STATE_UNHEALTHY = 3;
  HEALTH_STATE_NOT_READY = 4;
}

message HealthComponent {
  string name = 1;
  HealthState state = 2;
  string version = 3;
  string message = 4;
  google.protobuf.Struct details = 5;
}

message HealthReport {
  HealthState state = 1;
  repeated HealthComponent components = 2;
  google.protobuf.Timestamp checked_at = 3;
}
