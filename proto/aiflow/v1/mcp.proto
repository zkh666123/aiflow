syntax = "proto3";

package aiflow.v1;

import "aiflow/v1/common.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/gulugulu33/aiflow-studio/flowai-studio-control-plane/internal/gen/aiflow/v1;aiflowv1";

service McpService {
  rpc ManageMcp(ManageMcpRequest) returns (ManageMcpResponse);
}

enum McpTransport {
  MCP_TRANSPORT_UNSPECIFIED = 0;
  MCP_TRANSPORT_STDIO = 1;
  MCP_TRANSPORT_HTTP = 2;
}

message ConfigureMcp {
  string server_id = 1;
  string name = 2;
  McpTransport transport = 3;
  string endpoint = 4;
  repeated string arguments = 5;
  map<string, string> environment = 6;
  map<string, string> headers = 7;
}

message ConnectMcp {
  string server_id = 1;
}

message DisconnectMcp {
  string server_id = 1;
}

message DiscoverMcpTools {
  string server_id = 1;
  bool refresh = 2;
}

message CallMcpTool {
  string server_id = 1;
  string tool_name = 2;
  google.protobuf.Struct arguments = 3;
}

message ManageMcpRequest {
  RequestContext context = 1;

  oneof operation {
    ConfigureMcp configure = 2;
    ConnectMcp connect = 3;
    DisconnectMcp disconnect = 4;
    DiscoverMcpTools discover = 5;
    CallMcpTool call = 6;
  }
}

enum McpConnectionState {
  MCP_CONNECTION_STATE_UNSPECIFIED = 0;
  MCP_CONNECTION_STATE_DISCONNECTED = 1;
  MCP_CONNECTION_STATE_CONNECTING = 2;
  MCP_CONNECTION_STATE_CONNECTED = 3;
  MCP_CONNECTION_STATE_ERROR = 4;
}

message McpTool {
  string name = 1;
  string description = 2;
  google.protobuf.Struct input_schema = 3;
}

message McpServerResult {
  string server_id = 1;
  McpConnectionState state = 2;
  repeated McpTool tools = 3;
}

message McpToolResult {
  google.protobuf.Struct value = 1;
  bool is_error = 2;
}

message ManageMcpResponse {
  ServiceError error = 1;

  oneof result {
    McpServerResult server = 2;
    McpToolResult tool = 3;
  }
}
