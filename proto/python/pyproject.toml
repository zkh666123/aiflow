[project]
name = "flowai-proto"
version = "0.1.0"
description = "Generated FlowAI Studio gRPC contracts"
requires-python = ">=3.13,<3.14"
dependencies = [
  "grpcio==1.74.0",
  "protobuf==6.31.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiflow"]
